name: 🤖 SMTP Generator Bot

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'bot/**'
      - 'requirements.txt'
      - '.github/workflows/bot.yml'

concurrency:
  group: smtp-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    name: Run Telegram Bot
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Python dependencies
        run: pip install -r requirements.txt

      - name: 📦 Install Node dependencies
        run: npm install

      - name: 🔐 Restore Encrypted WhatsApp Sessions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f data/baileys_auths.enc ]; then
            echo "🔐 Found encrypted WhatsApp sessions. Restoring..."
            openssl enc -d -aes-256-cbc -pbkdf2 -in data/baileys_auths.enc -out data/baileys_auths.zip -pass pass:"$TELEGRAM_BOT_TOKEN"
            unzip -q -o data/baileys_auths.zip
            rm -f data/baileys_auths.zip
            echo "✅ Encrypted WhatsApp sessions successfully restored!"
          elif [ -f data/baileys_auth.enc ]; then
            echo "🔐 Found legacy encrypted WhatsApp session. Restoring..."
            openssl enc -d -aes-256-cbc -pbkdf2 -in data/baileys_auth.enc -out data/baileys_auth.zip -pass pass:"$TELEGRAM_BOT_TOKEN"
            unzip -q -o data/baileys_auth.zip
            rm -f data/baileys_auth.zip
            if [ -d data/baileys_auth ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              mv data/baileys_auth data/baileys_auth_$TELEGRAM_CHAT_ID
            fi
            echo "✅ Legacy WhatsApp session successfully restored and migrated!"
          else
            echo "ℹ️ No encrypted WhatsApp sessions found. A fresh session will be started."
          fi

      - name: 🔗 Start Baileys WA Checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PAIRING_PHONE_NUMBER: ${{ secrets.PAIRING_PHONE_NUMBER }}
          PORT: 3000
        run: |
          echo "Starting Baileys WhatsApp Checker..."
          npm start > wa_checker.log 2>&1 &
          sleep 5

      - name: 🚀 Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_ID:      ${{ github.run_id }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          GITHUB_SHA:         ${{ github.sha }}
          WA_CHECKER_URL:     "http://localhost:3000"
          GH_PAT:             ${{ secrets.GH_PAT }}
          MAILERSEND_API_KEY: ${{ secrets.MAILERSEND_API_KEY }}
          MAILERSEND_SENDER_EMAIL: ${{ secrets.MAILERSEND_SENDER_EMAIL }}
          CPANEL_API_URL:     ${{ secrets.CPANEL_API_URL }}
          CPANEL_API_KEY:     ${{ secrets.CPANEL_API_KEY }}
          CPANEL_DOMAIN:      ${{ secrets.CPANEL_DOMAIN }}
          CPANEL_URL:         ${{ secrets.CPANEL_URL }}
          CPANEL_USER:        ${{ secrets.CPANEL_USER }}
          CPANEL_PASS:        ${{ secrets.CPANEL_PASS }}
        run: |
          echo "✅ Bot starting at $(date -u)"
          echo "📦 Commit: ${{ github.sha }}"
          PYTHONPATH=bot python bot/main.py

      - name: 🔔 Notify if bot crashed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d parse_mode="Markdown" \
              -d text="⚠️ *Bot SMTP Generator Berhenti!*%0A━━━━━━━━━━━━━━━━━━━━%0A🔴 Status: Crashed / Error%0A⏰ Waktu: $(date -u '+%Y-%m-%d %H:%M UTC')%0A🆔 Run ID: \`${{ github.run_id }}\`%0A%0A🔄 Keepalive akan restart otomatis sesuai jadwal."
          fi

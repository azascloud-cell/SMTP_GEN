name: 🤖 SMTP Generator Bot

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'bot/**'
      - 'requirements.txt'
      - '.github/workflows/bot.yml'

concurrency:
  group: smtp-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    name: Run Telegram Bot
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🚀 Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_ID:      ${{ github.run_id }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          # ── cPanel via PHP Proxy API (InfinityFree) ───────────────────────
          CPANEL_API_URL:     ${{ secrets.CPANEL_API_URL }}
          CPANEL_API_KEY:     ${{ secrets.CPANEL_API_KEY }}
          CPANEL_DOMAIN:      ${{ secrets.CPANEL_DOMAIN }}
          # ── cPanel UAPI langsung (hosting non-InfinityFree, opsional) ─────
          CPANEL_URL:         ${{ secrets.CPANEL_URL }}
          CPANEL_USER:        ${{ secrets.CPANEL_USER }}
          CPANEL_PASS:        ${{ secrets.CPANEL_PASS }}
        run: |
          echo "✅ Bot starting at $(date -u)"
          cd bot
          python main.py

      - name: 🔔 Notify if bot crashed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d parse_mode="Markdown" \
              -d text="⚠️ *Bot SMTP Generator Berhenti!*%0A━━━━━━━━━━━━━━━━━━━━%0A🔴 Status: Crashed / Error%0A⏰ Waktu: $(date -u '+%Y-%m-%d %H:%M UTC')%0A🆔 Run ID: \`${{ github.run_id }}\`%0A%0A🔄 Keepalive akan restart otomatis sesuai jadwal."
          fi

name: Build Pterodactyl Package

on:
  workflow_dispatch:
  push:
    paths:
      - 'sc panel pterodactyl/**'
      - '.github/workflows/build-pterodactyl.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build zip package (Node.js only)
        run: |
          rm -rf /tmp/pterodactyl-package
          mkdir -p /tmp/pterodactyl-package/data
          cp wa_checker.js /tmp/pterodactyl-package/
          cp 'sc panel pterodactyl/package.json' /tmp/pterodactyl-package/
          cp 'sc panel pterodactyl/start.sh' /tmp/pterodactyl-package/
          cp 'sc panel pterodactyl/PTERODACTYL_SETUP.md' /tmp/pterodactyl-package/
          cp 'sc panel pterodactyl/README.md' /tmp/pterodactyl-package/
          cd /tmp/pterodactyl-package
          zip -qr "$GITHUB_WORKSPACE/sc panel pterodactyl/sc panel pterodactyl.zip" .
          unzip -tq "$GITHUB_WORKSPACE/sc panel pterodactyl/sc panel pterodactyl.zip"

      - name: Commit package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'sc panel pterodactyl/sc panel pterodactyl.zip'
          git diff --cached --quiet || git commit -m 'build: update Node.js-only Pterodactyl zip package'
          git push

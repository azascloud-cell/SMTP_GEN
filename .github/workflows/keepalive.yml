name: ♻️ Keep-Alive Bot

on:
  schedule:
    # Setiap 5 jam – restart bot sebelum GitHub Actions timeout 6 jam
    - cron: '0 */5 * * *'
  workflow_dispatch:           # bisa trigger manual juga

jobs:
  keepalive:
    name: Restart Bot Workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🔄 Trigger Bot Workflow via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO:     ${{ github.repository }}
        run: |
          echo "⏰ Keep-alive triggered at $(date -u)"

          # Trigger workflow bot.yml
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.github.com/repos/${REPO}/actions/workflows/bot.yml/dispatches" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"ref":"main"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Bot workflow berhasil di-trigger!"
          else
            echo "❌ Gagal trigger workflow: $HTTP_CODE"
            exit 1
          fi

      - name: 📢 Notify Keep-Alive Success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d parse_mode="Markdown" \
              -d text="♻️ *Bot Direstart oleh Keep-Alive*%0A━━━━━━━━━━━━━━━━━━━━%0A🔄 Status: Restarting...%0A⏰ Waktu: $(date -u '+%Y-%m-%d %H:%M UTC')%0A%0A✅ Bot akan aktif kembali dalam beberapa detik."
          fi
